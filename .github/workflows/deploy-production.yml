name: Deploy Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    name: Apply migrations and deploy
    runs-on: ubuntu-latest
    environment: production

    env:
      PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESELLER_PRICE_LIST_FROM: ${{ secrets.RESELLER_PRICE_LIST_FROM }}
      RESELLER_ADMIN_EMAIL: ${{ secrets.RESELLER_ADMIN_EMAIL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Link production Supabase project
        id: supabase_link
        continue-on-error: true
        run: bash .github/scripts/supabase-link-retry.sh "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Apply pending production migrations
        env:
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            export SUPABASE_LINKED=true
          else
            export SUPABASE_LINKED=false
          fi
          bash .github/scripts/supabase-db-push-remote.sh

      - name: Show migration status
        env:
          SUPABASE_DNS_RESOLVER: https
          SUPABASE_DB_POOLER_URL: ${{ secrets.SUPABASE_DB_POOLER_URL }}
        run: |
          if [ "${{ steps.supabase_link.outcome }}" = "success" ]; then
            supabase migration list --linked --dns-resolver https
          elif [ -n "${SUPABASE_DB_POOLER_URL:-}" ]; then
            supabase migration list --db-url "$SUPABASE_DB_POOLER_URL" --dns-resolver https
          else
            echo "Skipping migration list because Supabase link failed."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Write production env file
        working-directory: web
        run: bash ./scripts/render-production-env.sh

      - name: Build
        working-directory: web
        run: npm run build

      - name: Deploy to Cloudflare Workers
        working-directory: web
        run: npx wrangler deploy --env-file .env.production
