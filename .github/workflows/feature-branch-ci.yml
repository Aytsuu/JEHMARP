name: Feature Branch CI

on:
  push:
    branches-ignore:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: feature-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci_publishable_key
  SUPABASE_SECRET_KEY: ci_secret_key
  PUBLIC_TURNSTILE_SITE_KEY: ci_turnstile_site_key
  TURNSTILE_SECRET_KEY: ci_turnstile_secret_key
  UPSTASH_REDIS_REST_URL: https://redis.example.test
  UPSTASH_REDIS_REST_TOKEN: ci_redis_token

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Astro check
        working-directory: web
        run: npm run check

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
