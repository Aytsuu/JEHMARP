name: Backup and Rollback

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: backup-production-db
        type: choice
        options:
          - backup-production-db
          - export-dashboard-data
          - export-public-content
          - migration-status
          - rollback-checklist
      prior_worker_version_id:
        description: Optional prior stable Worker version ID for rollback checklist
        required: false
        type: string
      forward_repair_note:
        description: Optional forward-repair migration or runbook reference
        required: false
        type: string
      restore_rehearsal_verified:
        description: Include restore rehearsal marker in backup artifact (set after restore rehearsal)
        required: false
        type: boolean
        default: false
      restore_rehearsal_note:
        description: Optional text describing how restore rehearsal was verified
        required: false
        type: string

permissions:
  contents: read

jobs:
  backup-and-rollback:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Link production Supabase project
        run: bash .github/scripts/supabase-link-retry.sh "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Create backup directory
        run: mkdir -p backups

      - name: Backup production database
        if: inputs.operation == 'backup-production-db'
        env:
          RESTORE_REHEARSAL_VERIFIED: ${{ inputs.restore_rehearsal_verified }}
          RESTORE_REHEARSAL_NOTE: ${{ inputs.restore_rehearsal_note }}
        run: |
          {
            echo "### Production database backup"
            echo ""
            echo "This artifact contains production data, including admin dashboard, agent dashboard, auth, storage metadata, and product image objects."
            echo "Store it securely after download and delete local copies when they are no longer needed."
            echo ""
            echo "Record this workflow run id (\`${{ github.run_id }}\`) as \`backup_run_id\` when running **Deploy Contract Release**."
            echo "Contract migration headers should reference this run in \`backup-verified\` (for example \`github-actions-run-${{ github.run_id }}\`)."
            if [ "$RESTORE_REHEARSAL_VERIFIED" = "true" ]; then
              echo ""
              echo "Restore rehearsal marker and notes are included in this artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --role-only --file "backups/production-roles-${{ github.run_id }}.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --file "backups/production-schema-${{ github.run_id }}.sql"
          supabase db dump --linked --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy --schema public,auth,storage --exclude "storage.buckets_vectors" --exclude "storage.vector_indexes" --file "backups/production-data-${{ github.run_id }}.sql"
          mkdir -p "backups/storage"
          supabase storage cp --linked --recursive "ss:///product-images" "backups/storage/product-images"

          if [ "$RESTORE_REHEARSAL_VERIFIED" = "true" ]; then
            echo "${{ github.run_id }}" > "backups/restore-rehearsal-verified.marker"
            {
              echo "# Restore rehearsal evidence"
              echo ""
              echo "Backup workflow run id: \`${{ github.run_id }}\`"
              echo "Recorded at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo ""
              echo "## Operator notes"
              echo ""
              if [ -n "${RESTORE_REHEARSAL_NOTE:-}" ]; then
                printf '%s\n' "$RESTORE_REHEARSAL_NOTE"
              else
                echo "Document the restore rehearsal performed (target environment, validation queries, row counts)."
              fi
              echo ""
              echo "## Contract release"
              echo ""
              echo "Use this run id as \`backup_run_id\` and set \`restore_rehearsal_verified=true\` when dispatching Deploy Contract Release."
            } > "backups/restore-rehearsal-notes.md"
          fi

      - name: Export dashboard data
        if: inputs.operation == 'export-dashboard-data'
        run: |
          {
            echo "### Dashboard data export"
            echo ""
            echo "CSV exports include the public tables used by the admin and agent dashboards."
            echo "This artifact contains customer, order, invoice, payment, commission, inquiry, reseller, profile, product, content, media, and analytics data."
          } >> "$GITHUB_STEP_SUMMARY"

          supabase db query --linked --output csv "select * from public.profile order by created_at;" > "backups/profile-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.admin_role order by created_at;" > "backups/admin-role-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.agent_profile order by created_at;" > "backups/agent-profile-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.customer order by created_at;" > "backups/customer-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.product order by created_at;" > "backups/product-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.customer_order order by created_at;" > "backups/customer-order-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.customer_order_item order by created_at;" > "backups/customer-order-item-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.invoice order by created_at;" > "backups/invoice-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.payment order by created_at;" > "backups/payment-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.customer_order_status_history order by changed_at;" > "backups/customer-order-status-history-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.contact_inquiry order by created_at;" > "backups/contact-inquiry-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.reseller_application order by created_at;" > "backups/reseller-application-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.page order by slug;" > "backups/page-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.page_section order by page_id, sort_order;" > "backups/page-section-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.analytics_daily order by day;" > "backups/analytics-daily-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.analytics_product_daily order by day, product_id;" > "backups/analytics-product-daily-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.analytics_agent_daily order by day, agent_id;" > "backups/analytics-agent-daily-${{ github.run_id }}.csv"

      - name: Export public landing page content
        if: inputs.operation == 'export-public-content'
        run: |
          supabase db query --linked --output csv "select * from public.page order by slug;" > "backups/page-${{ github.run_id }}.csv"
          supabase db query --linked --output csv "select * from public.page_section order by page_id, sort_order;" > "backups/page-section-${{ github.run_id }}.csv"

      - name: Show migration status
        if: inputs.operation == 'migration-status'
        run: supabase migration list --linked | tee "backups/migration-status-${{ github.run_id }}.txt"

      - name: Capture Worker version listing
        if: inputs.operation == 'rollback-checklist'
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p backups
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Skipping Worker version listing; Cloudflare credentials not configured."
            exit 0
          fi
          bash .github/scripts/cloudflare-worker-canary.sh deployments-status --json \
            > "backups/worker-deployments-status-${{ github.run_id }}.json"
          bash .github/scripts/cloudflare-worker-canary.sh list-versions --json \
            > "backups/worker-versions-list-${{ github.run_id }}.json"

      - name: Create rollback checklist
        if: inputs.operation == 'rollback-checklist'
        env:
          PRIOR_WORKER_VERSION_ID: ${{ inputs.prior_worker_version_id }}
          FORWARD_REPAIR_NOTE: ${{ inputs.forward_repair_note }}
        run: |
          {
            echo "# Production Rollback Checklist"
            echo ""
            echo "Run ID: ${{ github.run_id }}"
            echo ""
            echo "## Contract release inputs"
            echo ""
            echo "- Use this run id as \`backup_run_id\` in **Deploy Contract Release** when this backup operation succeeded."
            echo "- Ensure pending Contract migration headers include matching \`backup-verified\` and completed compatibility-window evidence."
            echo ""
            echo "## Immediate application rollback"
            echo ""
            echo "1. Identify the failed deployment and the last known good Worker version ID."
            if [ -n "${PRIOR_WORKER_VERSION_ID:-}" ]; then
              echo "2. Prior stable Worker version (workflow input): \`${PRIOR_WORKER_VERSION_ID}\`"
            else
              echo "2. Prior stable Worker version: capture from Deploy Production release summary or worker-versions-list artifact."
            fi
            echo "3. Reverse Worker traffic first using gradual deployment or 100% traffic to the prior stable version."
            echo "4. Do not automatically roll back database schema or restore a database backup for an application-only rollback."
            echo ""
            echo "## Database repair (only if required)"
            echo ""
            if [ -n "${FORWARD_REPAIR_NOTE:-}" ]; then
              echo "- Forward-repair reference: ${FORWARD_REPAIR_NOTE}"
            else
              echo "- Forward-repair: document the migration or runbook that repairs schema/data if rollback exposed inconsistency."
            fi
            echo "- Write and review an explicit SQL repair script; never assume destructive DDL is reversible."
            echo "- Create a fresh production backup before executing any repair script."
            echo ""
            echo "## Verification"
            echo ""
            echo "- Run production smoke tests against the rolled-back Worker version."
            echo "- Verify public pages, login pages, admin redirects, and critical APIs after recovery."
            echo "- Review worker-deployments-status and worker-versions-list artifacts when Cloudflare credentials are configured."
          } > "backups/rollback-checklist-${{ github.run_id }}.md"

      - name: Upload operation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.operation }}-${{ github.run_id }}
          path: backups/
          if-no-files-found: error
          retention-days: 7
