name: Production Smoke Tests

on:
  workflow_run:
    workflows:
      - Deploy Production
    types:
      - completed
  workflow_dispatch:
    inputs:
      worker_version_id:
        description: Optional Worker version ID for version-targeted smoke (override header)
        required: false
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke test production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production

    env:
      PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_VERSION_ID: ${{ inputs.worker_version_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve production base URL
        shell: bash
        run: |
          set -euo pipefail
          PRODUCTION_BASE_URL="$(bash .github/scripts/resolve-production-base-url.sh)"
          echo "Using production base URL: ${PRODUCTION_BASE_URL}"
          echo "PRODUCTION_BASE_URL=${PRODUCTION_BASE_URL}" >> "$GITHUB_ENV"

      - name: Run production smoke checks
        shell: bash
        run: bash .github/scripts/production-smoke.sh
