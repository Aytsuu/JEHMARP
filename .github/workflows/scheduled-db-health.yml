name: Scheduled DB Health

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-db-health:
    name: Production database health
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      - name: Test Supabase advisor retry helper
        run: bash .github/scripts/tests/supabase-advisors-retry.test.sh

      - name: Show Supabase CLI version
        run: supabase --version

      - name: Link production Supabase project
        run: bash .github/scripts/supabase-link-retry.sh "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Check migration status
        run: supabase migration list --linked

      - name: Run production advisors
        run: bash .github/scripts/supabase-advisors-retry.sh
        timeout-minutes: 2

      - name: Check exposed public tables with RLS disabled
        run: |
          supabase db query --linked "select schemaname, tablename from pg_tables where schemaname in ('public', 'graphql_public') and rowsecurity = false order by schemaname, tablename;"
